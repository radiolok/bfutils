name: bfutils CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: gcc,   cxx: g++ }
          - { cc: clang, cxx: clang++ }
    name: build-test (${{ matrix.compiler.cc }})
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
    - uses: actions/checkout@v5

    - name: Configure
      run: cmake -S . -B build

    - name: Build
      run: cmake --build build -j

    # dpcrun golden-model unit tests (REQ-GM-001/003/004)
    - name: Unit tests
      run: ctest --test-dir build --output-on-failure

    # End-to-end: bfpp + bfrun and dpcrun on helloworld and pi
    - name: Smoke test
      run: bash test/test.sh
